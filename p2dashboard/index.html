<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Admin Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-speedometer2"></i>
            Employee Admin Dashboard
        </span>
    </div>
</nav>

<div class="container mt-4">

    <!-- Dashboard Cards -->
    <div class="row g-3">

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <i class="bi bi-people-fill fs-1 text-primary"></i>
                    <h3 id="totalEmployees">0</h3>
                    <p>Total Employees</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <i class="bi bi-person-check-fill fs-1 text-success"></i>
                    <h3 id="activeEmployees">0</h3>
                    <p>Active Employees</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <i class="bi bi-building fs-1 text-warning"></i>
                    <h3>5</h3>
                    <p>Departments</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <i class="bi bi-currency-rupee fs-1 text-danger"></i>
                    <h3 id="salaryTotal">0</h3>
                    <p>Total Salary</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Add Employee -->
    <div class="card shadow mt-4">
        <div class="card-header bg-primary text-white">
            Add Employee
        </div>

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-4">
                    <input type="text" id="name" class="form-control" placeholder="Employee Name">
                </div>

                <div class="col-md-4">
                    <input type="text" id="department" class="form-control" placeholder="Department">
                </div>

                <div class="col-md-4">
                    <input type="text" id="position" class="form-control" placeholder="Position">
                </div>

                <div class="col-md-4">
                    <input type="number" id="salary" class="form-control" placeholder="Salary">
                </div>

                <div class="col-md-4">
                    <select id="status" class="form-select">
                        <option>Active</option>
                        <option>Inactive</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <button class="btn btn-success w-100" onclick="addEmployee()">
                        Add Employee
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- Search -->
    <div class="mt-4">
        <input type="text"
               id="search"
               class="form-control"
               placeholder="Search Employee..."
               onkeyup="searchEmployee()">
    </div>

    <!-- Employee Table -->
    <div class="card shadow mt-4">

        <div class="card-header bg-dark text-white">
            Employee List
        </div>

        <div class="table-responsive">

            <table class="table table-bordered table-hover mb-0">

                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Position</th>
                        <th>Salary</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">
                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="js/script.js"></script>

</body>
</html>

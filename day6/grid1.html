<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>

        .product{
            display: grid;
           grid-template-columns: repeat(6,150px);
           gap: 20px;

        }
        .box{
            background-color: brown;
            border: 1px solid blue;
            text-align: center;
            color: aliceblue;


        }
    </style>
</head>
<body>
    <div class="product">
        <div class="box">prduct1</div>
          <div class="box">prduct2</div>
            <div class="box">prduct3</div>
              <div class="box">prduct4</div>
                <div class="box">prduct5</div>
                  <div class="box">prduct6</div>

    </div>
</body>
</html>

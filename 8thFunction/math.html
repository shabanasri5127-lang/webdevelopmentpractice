<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //math object is used to perform mathematical operations. work directly with numbers. it is a built-in object in javascript.
        console.log(Math.PI);
        console.log(Math.round(4.5));
        //floor() - returns the largest integer less than or equal to a given number.
        console.log(Math.floor(4.7));
        //ceil() - returns the smallest integer greater than or equal to a given number.
        console.log(Math.ceil(4.7));
        console.log(Math.pow(2, 3));
        console.log(Math.sqrt(16));
        console.log(Math.abs(-5));
        console.log(Math.min(1, 2, 3, 4, 5));
        console.log(Math.max(1, 2, 3, 4, 5));
        console.log(Math.random());

        
        console.log( Math.floor(Math.random() * 4) + 1); //random number between 1 and 4   
        console.log(Math.random() * 100);
        console.log(Math.floor(Math.random() * 100));
    </script>
</body>
</html>

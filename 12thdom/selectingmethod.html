<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Selecting Methods</h1>
    <p id="mpy">This is a simple example of selecting methods in HTML.</p>
    <div class="myClass">Div 1</div>
    <div class="myClass">Div 2</div>
    <p>This is another paragraph.</p>
    <div>This is a div without a class.</div>
    <script>
        //without id or class name
        const allDivs = document.getElementsByTagName("div");
        console.log("All div elements:", allDivs);

        // Selecting an element by ID
        const paragraph = document.getElementById("mpy");
        paragraph.style.color = "blue";
        paragraph.style.fontSize = "20px";

        // Selecting elements by class name
        const elements = document.getElementsByClassName("myClass");
        for (let i = 0; i < elements.length; i++) {
            elements[i].style.backgroundColor = "yellow";
        }
        //index using getElementsByClassName
        console.log("First element with class 'myClass':", elements[0].textContent);

        // Selecting elements by tag name
        const divs = document.getElementsByTagName("div");
        for (let i = 0; i < divs.length; i++) {
            divs[i].style.border = "1px solid black";
        }

        // Selecting elements using querySelector
        const firstParagraph = document.querySelector("p");
        firstParagraph.style.fontWeight = "bold";

        // Selecting all paragraphs using querySelectorAll
        const allParagraphs = document.querySelectorAll("p");
        allParagraphs.forEach(p => {
            p.style.marginBottom = "10px";
            //selecting css using querySelectorAll
            p.style.color = "green"; forEach
          //querySelected()---->classname,idname,tagname,css
          
        });
    </script>
</body>
</html>

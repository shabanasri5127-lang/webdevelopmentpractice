<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //CallBack Hell

        function first(payment,callback){
            console.log("payment processing " + payment )

            callback("1000", function(){
                console.log("payment sucessful")
            })
        }

        first("continue", function(payment2,callback){
           console.log("payment pending",payment2 )
           callback()
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Programs</title>
</head>
<body>

<script>

// 1. Find Even or Odd Number
let num = 10;

if (num % 2 == 0) {
    console.log(num + " is Even,sir");
} else {
    console.log(num + " is Odd,sir");
}


// 2. Find Prime Number
let n = 7;
let prime = true;

for (let i = 2; i < n; i++) {
    if (n % i == 0) {
        prime = false;
        break;
    }
}

if (prime && n > 1) {
    console.log(n + " is Prime");
} else {
    console.log(n + " is Not Prime");
}


// 3. Sum of 1 + 2 + 3 + 4 +5
let sum = 0;

for (let i = 1; i <= 5; i++)//for loop to iterate from 1 to 5

{
    sum += i;
}

console.log("Sum = " + sum);


// 4. Reverse a String
let str = "hello";
let rev = " ";

for (let i = str.length - 1; i >= 0; i--) {
    rev += str[i];
}

console.log("Reverse = " + rev);

</script>

</body>
</html>
